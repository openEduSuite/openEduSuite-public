#
# Blackbox Probes chart values
# =============================
# This chart deploys:
#   1. A ConfigMap listing all probe targets (consumed by Prometheus blackbox-exporter)
#   2. A PrometheusRule with alert definitions for probe failures
#
# The blackbox-exporter itself is deployed separately in the monitoring namespace
# (see ansible-baremetal-k3s/k8s/monitoring/prometheus-live-blackbox.yml for module config).
#
# Probe modules (defined in blackbox-exporter ConfigMap):
#   http_alive  — HTTP GET, accepts 200/204/301/302/307/308/400/401/403/404/405/429
#   http_2xx    — HTTP GET, accepts 200/302/404
#   tcp_connect — TCP connect
#   tls_connect — TCP connect with TLS

# ---------------------------------------------------------------------------
# Namespace (defaults to Release namespace)
# ---------------------------------------------------------------------------
namespace: ""

# ---------------------------------------------------------------------------
# Probe targets
# ---------------------------------------------------------------------------
# Each target is probed by the blackbox-exporter. The Prometheus scrape config
# in ansible-baremetal-k3s references these targets.
probes:

  # --- HTTP probes (http_alive module) ---
  # All public ingress endpoints. Accepts 200/302/401/403 (redirects, auth gates).
  http:
    # Core platform
    - name: home-portal
      url: https://example.org/
      severity: critical
      category: platform
    - name: home-dashboard
      url: https://home.example.org/
      severity: critical
      category: platform
    - name: admin-portal
      url: https://admin.example.org/
      severity: warning
      category: platform
    - name: admin-home
      url: https://admin.home.example.org/
      severity: warning
      category: platform
    - name: keycloak
      url: https://id.example.org/
      severity: critical
      category: sso
    - name: keycloak-oidc-discovery
      url: https://id.example.org/realms/openedusuite/.well-known/openid-configuration
      severity: critical
      category: sso
    - name: keycloak-auth-endpoint
      url: "https://id.example.org/realms/openedusuite/protocol/openid-connect/auth?client_id=account-console&response_type=code&scope=openid&redirect_uri=https%3A%2F%2Fid.example.org%2Frealms%2Fopenedusuite%2Faccount&state=probe"
      severity: critical
      category: sso
    - name: keycloak-token-endpoint
      url: https://id.example.org/realms/openedusuite/protocol/openid-connect/token
      severity: critical
      category: sso
    - name: argocd
      url: https://argocd.example.org/
      severity: warning
      category: platform
    - name: grafana
      url: https://grafana.home.example.org/
      severity: warning
      category: monitoring

    # Education services
