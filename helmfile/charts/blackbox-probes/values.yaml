      severity: critical
    - name: keycloak-token-endpoint
      url: https://id.example.org/realms/openedusuite/protocol/openid-connect/token
      severity: critical
    - name: matrix-login
      url: https://matrix.example.org/_matrix/client/v3/login
      severity: warning
    - name: opencloud-login
      url: https://cloud.example.org/login
