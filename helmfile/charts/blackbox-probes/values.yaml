      severity: warning
    - name: openproject-login
      url: https://openproject.example.org/login
      severity: warning
    - name: sogo-login
      url: https://sogo.example.org/SOGO/
      severity: warning
    - name: portal-home
      url: https://home.example.org/
      severity: warning
    - name: bbb
      url: https://bbb.example.org/
      severity: warning
    - name: dify
      url: https://dify.example.org/
      severity: warning
    - name: drawio
      url: https://drawio.example.org/
      severity: warning
    - name: excalidraw
      url: https://excalidraw.example.org/
      severity: warning
    - name: n8n
