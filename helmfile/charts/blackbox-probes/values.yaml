# ---------------------------------------------------------------------------
# Alerting
# ---------------------------------------------------------------------------
alerts:
  enabled: true
  # Alert when any probe fails for more than 3 minutes
  probeFailedFor: 3m
  # Alert when SSO core endpoints fail for more than 1 minute
  ssoFailedFor: 1m
  # Alert when app login endpoints fail for more than 5 minutes
  appLoginFailedFor: 5m
  # Alert when probe returns 5xx for more than 5 minutes
  probe5xxFor: 5m

# ---------------------------------------------------------------------------
# Blackbox exporter config
# ---------------------------------------------------------------------------
blackboxExporter:
  # The blackbox-exporter service address (in monitoring namespace)
  address: blackbox-exporter.monitoring.svc.cluster.local:9115
  # The module to use for HTTP probes
  httpModule: http_alive
  # The module to use for TCP probes
  tcpModule: tcp_connect
  # The module to use for TLS probes
  tlsModule: tls_connect
