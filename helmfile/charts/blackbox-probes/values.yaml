  # --- TCP probes (tcp_connect module) ---
  tcp:
    - name: stalwart-smtp
      target: stalwart.openedusuite.svc.cluster.local:25
      severity: critical
      category: mail
    - name: stalwart-submission
      target: stalwart.openedusuite.svc.cluster.local:587
      severity: critical
      category: mail
    - name: stalwart-imap
      target: stalwart.openedusuite.svc.cluster.local:143
      severity: critical
      category: mail

  # --- TLS probes (tls_connect module) ---
  tls:
    - name: stalwart-smtps
      target: stalwart.openedusuite.svc.cluster.local:465
      severity: critical
      category: mail
    - name: stalwart-imaps
      target: stalwart.openedusuite.svc.cluster.local:993
      severity: critical
      category: mail

  # --- SSO flow probes (http_alive module) ---
  # These verify the full SSO redirect chain for each app.
  ssoFlows:
    - name: keycloak-oidc-discovery
      url: https://id.example.org/realms/openedusuite/.well-known/openid-configuration
      severity: critical
    - name: keycloak-auth-endpoint
