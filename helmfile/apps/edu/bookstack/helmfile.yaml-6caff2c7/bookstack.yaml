affinity: {}
bookstack:
  db:
    name: bookstack
    user: bookstack
  image: ghcr.io/openedusuite/bookstack
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  tag: v26.05.2-ls276
  volumes:
    uploads:
      accessMode: ReadWriteOnce
      size: 1Gi
      storageClass: ceph-rbd-ssd
commonAnnotations: null
ingress:
  annotations:
    haproxy-ingress.github.io/headers: X-Forwarded-Host wiki.example.org
    haproxy-ingress.github.io/proxy-body-size: 50m
    haproxy-ingress.github.io/ssl-redirect: "true"
    haproxy-ingress.github.io/timeout-client: 300ss
    haproxy-ingress.github.io/timeout-server: 300ss
  className: haproxy
  enabled: true
  hosts:
  - host: wiki.example.org
    paths:
    - path: /
      pathType: ImplementationSpecific
  tls:
  - hosts:
    - wiki.example.org
    secretName: opendesk-certificates-tls
mariadb:
  auth:
    database: bookstack
    password: ""
    username: bookstack
  enabled: true
  monitoring:
    enabled: true
  pdb:
    enabled: true
    minAvailable: 1
  primary:
    persistence:
      accessMode: ReadWriteOnce
      enabled: true
      size: 8Gi
nodeSelector: {}
persistence:
  size: 1Gi
  storageClass: null
service:
  annotations: null
  enabled: true
  externalPort: 80
serviceAccount:
  annotations: null
sso:
  oidc:
    clientId: opendesk-bookstack
    clientSecret: CHANGEME
    enabled: true
    issuerBaseUrl: https://id.example.org/realms/opendesk
tolerations: []
volumePermissions:
  enabled: true
