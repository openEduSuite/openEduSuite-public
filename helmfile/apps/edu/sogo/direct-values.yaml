---
sogo:
  image:
    repository: alinto/sogo
    tag: "5.11.0"
    pullPolicy: IfNotPresent
  
  db:
    host: postgresql
    port: 5432
    user: sogo
    password: CHANGEME
    name: sogo
    initJob:
      enabled: false
  
  ldap:
    host: openldap
    port: 389
    baseDN: ou=users,dc=example,dc=org
    bindDN: uid=sogo,ou=services,dc=example,dc=org
    bindPassword: CHANGEME
  
  imap:
    server: imaps://dovecot:993
  smtp:
    server: smtp://postfix:587
  sieve:
    server: sieve://dovecot:4190
  
  mailDomain: example.org
  timezone: "Europe/Berlin"
  language: "English"
  pageTile: "openDesk Mail"
  memcachedHost: memcached:11211
  
  oidc:
    enabled: true
    configUrl: https://id.desk.example.org/realms/opendesk/.well-known/openid-configuration
    clientId: sogo
    clientSecret: auto-generated
    scope: "openid profile email"
  
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: sogo.desk.example.org
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: tls-sogo.desk.example.org
        hosts:
          - sogo.desk.example.org
  
  persistence:
    enabled: false
  
  entrypoint:
    enabled: true

replicas: 1

service:
  type: ClusterIP
  port: 80