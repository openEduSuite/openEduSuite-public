<?xml version="1.0" encoding="UTF-8"?>
<!--
  openEduSuite — Projektübersicht (Landing-Poster, Fauvismus / Scherenschnitte)
  Stil: Henri Matisse («Jazz», «Die Schnecke») — kräftige, flächige
  Papierschnitt-Formen (Blätter, Spirale, Band) in Komplementärfarben; die
  große Kobalt-Spirale (Fokus) liegt auf dem φ-Punkt (~1038, ~643).
  Golden-Ratio-Canvas 1680×1040 (φ ≈ 1,618).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1040" role="img"
     aria-label="openEduSuite Projektübersicht im Stil von Henri Matisse: ein Login für Mail, Chat, Cloud, Video, Dokumente, Kalender, Identität und KI">
  <!-- Grund + Korallenrahmen (über der Fußleiste) -->
  <rect x="0" y="0" width="1680" height="1040" fill="#f4e7d0"/>
  <rect x="20" y="20" width="1640" height="850" fill="none" stroke="#d84424" stroke-width="18"/>
  <rect x="34" y="34" width="1612" height="822" fill="none" stroke="#e26d9a" stroke-width="6" opacity="0.6"/>

  <!-- Scherenschnitt-Band (Tänzerin, „Jazz“) -->
  <path d="M 470 150 C 700 290 540 430 760 570 C 890 665 820 770 660 820"
        fill="none" stroke="#2456c8" stroke-width="40" stroke-linecap="round" opacity="0.95"/>

  <!-- Schnitt-Blätter (linsenförmige Cut-outs) -->
  <path d="M 210 330 Q 300 200 430 290 Q 300 390 210 330 Z" fill="#1f9a6e"/>
  <path d="M 250 640 Q 380 530 520 620 Q 380 730 250 640 Z" fill="#e26d9a"/>
  <path d="M 1180 170 Q 1290 60 1420 150 Q 1290 240 1180 170 Z" fill="#eeb422"/>
  <path d="M 760 520 Q 870 420 1000 510 Q 870 620 760 520 Z" fill="#d84424"/>
  <path d="M 300 800 Q 410 700 560 780 Q 410 880 300 800 Z" fill="#7a3f9e"/>

  <!-- Kleine Schnittpunkte / Kreise -->
  <circle cx="420" cy="150" r="26" fill="#eeb422"/>
  <circle cx="700" cy="110" r="18" fill="#d84424"/>
  <circle cx="1500" cy="180" r="30" fill="#1f9a6e"/>
  <circle cx="1530" cy="470" r="22" fill="#2456c8"/>
  <circle cx="1500" cy="770" r="34" fill="#e26d9a"/>
  <circle cx="180" cy="870" r="20" fill="#7a3f9e"/>

  <!-- Schnitt-Balken -->
  <rect x="34" y="120" width="420" height="24" rx="12" fill="#eeb422"/>
  <rect x="1240" y="780" width="180" height="24" rx="12" fill="#2456c8"/>

  <!-- ══════════ Fokus: Kobalt-Spirale (φ-Punkt 1038/643) ══════════ -->
  <path d="M 1038 480 A 163 163 0 0 1 1201 643
           A 163 163 0 0 1 1038 806
           A 120 120 0 0 1 918 643
           A 90 90 0 0 1 1038 553
           A 60 60 0 0 1 1098 643
           A 34 34 0 0 1 1038 677"
        fill="none" stroke="#2456c8" stroke-width="44" stroke-linecap="round"/>

  <!-- ══════════ Marken-Fußleiste ══════════ -->
  <rect x="0" y="890" width="1680" height="150" fill="#1c1813"/>
  <rect x="0" y="890" width="1680" height="6" fill="#c05a2c"/>

  <!-- Monogramm -->
  <rect x="120" y="924" width="64" height="64" rx="16" fill="#bf4a2a"/>
  <text x="152" y="966" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
        font-size="30" font-weight="700" fill="#f2e8d2">oE</text>

  <!-- Markenname + Untertitel -->
  <text x="212" y="958" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
        font-size="52" font-weight="700" fill="#f2e8d2">openEduSuite</text>
  <text x="214" y="994" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
        font-size="24" fill="#c9b896">Ein Login — alle Dienste der Universität.</text>

  <!-- Leistungsbilanz rechts -->
  <text x="1560" y="952" text-anchor="end" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
        font-size="26" font-weight="600" fill="#f2e8d2">32 Dienste · ein Login</text>
  <text x="1560" y="986" text-anchor="end" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
        font-size="18" fill="#a89a80">Fauvismus · nach Henri Matisse</text>
</svg>
