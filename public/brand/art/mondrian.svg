<?xml version="1.0" encoding="UTF-8"?>
<!--
  openEduSuite — Projektübersicht (Landing-Poster, Neoplastizismus)
  Stil: Piet Mondrian — strenges Raster aus Primärfarben (Rot/Blau/Gelb) auf
  Weiß mit schwarzen Gitterlinien («Broadway Boogie Woogie»): die Dienste der
  openEduSuite als rhythmische Farbflächen; der zentrale rote Fokus liegt auf
  dem φ-Punkt (~1038, ~643). Golden-Ratio-Canvas 1680×1040 (φ ≈ 1,618).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1040" role="img"
     aria-label="openEduSuite Projektübersicht im Stil von Piet Mondrian: ein Login für Mail, Chat, Cloud, Video, Dokumente, Kalender, Identität und KI">
  <defs>
    <style>
      .cell { fill: #f4f1e8; }
      .line { stroke: #141210; stroke-width: 12; }
    </style>
  </defs>

  <!-- ══════════ Grund ══════════ -->
  <rect x="0" y="0" width="1680" height="1040" fill="#f4f1e8"/>

  <!-- ══════════ Farbflächen (Raster, oberhalb der Fußleiste) ══════════ -->
  <rect x="0"    y="0"    width="250" height="190" fill="#e8c32e"/> <!-- Gelb -->
  <rect x="1470" y="0"    width="210" height="190" fill="#1f3f8f"/> <!-- Blau -->
  <rect x="560"  y="190"  width="340" height="240" fill="#1f3f8f"/> <!-- Blau: Post -->
  <rect x="1470" y="190"  width="210" height="240" fill="#e8c32e"/> <!-- Gelb -->
  <rect x="0"    y="430"  width="250" height="230" fill="#d03a2b"/> <!-- Rot -->
  <rect x="900"  y="430"  width="380" height="230" fill="#d03a2b"/> <!-- Rot: Fokus -->
  <rect x="1280" y="430"  width="190" height="230" fill="#1f3f8f"/> <!-- Blau: Termin -->
  <rect x="900"  y="660"  width="380" height="230" fill="#e8c32e"/> <!-- Gelb -->

  <!-- ⌘ Dienste-Metaphern als weiße Glyphen in den Farbflächen -->
  <!-- Post (Briefumschlag, Blau) -->
  <g fill="none" stroke="#f4f1e8" stroke-width="8" stroke-linejoin="round">
    <rect x="690" y="282" width="80" height="54" rx="6" fill="#f4f1e8" stroke="#f4f1e8"/>
    <polyline points="690,286 730,316 770,286"/>
  </g>
  <!-- Chat (Sprechblase, Rot — Fokus) -->
  <g fill="#f4f1e8">
    <rect x="1030" y="495" width="120" height="66" rx="33"/>
    <polygon points="1040,552 1032,604 1090,560"/>
    <circle cx="1064" cy="528" r="7" fill="#d03a2b"/>
    <circle cx="1090" cy="528" r="7" fill="#d03a2b"/>
    <circle cx="1116" cy="528" r="7" fill="#d03a2b"/>
  </g>
  <!-- Termin (Kalender, Blau) -->
  <g fill="#f4f1e8">
    <rect x="1322" y="505" width="98" height="80" rx="8"/>
  </g>
  <g fill="none" stroke="#1f3f8f" stroke-width="7" stroke-linecap="round">
    <line x1="1322" y1="532" x2="1420" y2="532"/>
    <line x1="1345" y1="505" x2="1345" y2="522"/>
    <line x1="1398" y1="505" x2="1398" y2="522"/>
  </g>
  <g fill="#1f3f8f">
    <circle cx="1342" cy="555" r="6"/>
    <circle cx="1371" cy="555" r="6"/>
    <circle cx="1400" cy="555" r="6"/>
    <circle cx="1342" cy="578" r="6"/>
    <circle cx="1371" cy="578" r="6"/>
    <circle cx="1400" cy="578" r="6"/>
  </g>

  <!-- ♪ «Boogie-Woogie»-Akzente (kleine Farbquadrate auf den weißen Zellen) -->
  <rect x="330"  y="40"   width="42"  height="42"  fill="#141210"/>
  <rect x="1010" y="40"   width="26"  height="26"  fill="#d03a2b"/>
  <rect x="330"  y="250"  width="34"  height="34"  fill="#1f3f8f"/>
  <rect x="680"  y="470"  width="30"  height="30"  fill="#e8c32e"/>
  <rect x="360"  y="520"  width="56"  height="56"  fill="#141210"/>
  <rect x="300"  y="560"  width="22"  height="22"  fill="#d03a2b"/>
  <rect x="300"  y="710"  width="40"  height="40"  fill="#d03a2b"/>
  <rect x="640"  y="730"  width="28"  height="28"  fill="#141210"/>
  <rect x="1380" y="720"  width="48"  height="48"  fill="#141210"/>
  <rect x="1510" y="760"  width="24"  height="24"  fill="#e8c32e"/>

  <!-- ══════════ Schwarzes Raster (horizontal/vertikal, 12 px) ══════════ -->
  <g class="line">
    <line x1="250" y1="0" x2="250" y2="890"/>
    <line x1="560" y1="0" x2="560" y2="890"/>
    <line x1="900" y1="0" x2="900" y2="890"/>
    <line x1="1280" y1="0" x2="1280" y2="890"/>
    <line x1="1470" y1="0" x2="1470" y2="890"/>
    <line x1="0" y1="190" x2="1680" y2="190"/>
    <line x1="0" y1="430" x2="1680" y2="430"/>
    <line x1="0" y1="660" x2="1680" y2="660"/>
    <!-- Rahmen -->
    <rect x="0" y="0" width="1680" height="890" fill="none"/>
  </g>

  <!-- ══════════ Marken-Fußleiste ══════════ -->
  <rect x="0" y="890" width="1680" height="150" fill="#1c1813"/>
  <rect x="0" y="890" width="1680" height="6" fill="#c05a2c"/>

  <!-- Monogramm -->
  <rect x="120" y="924" width="64" height="64" rx="16" fill="#bf4a2a"/>
  <text x="152" y="966" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
        font-size="30" font-weight="700" fill="#f2e8d2">oE</text>

  <!-- Markenname + Untertitel -->
  <text x="212" y="958" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
        font-size="52" font-weight="700" fill="#f2e8d2">openEduSuite</text>
  <text x="214" y="994" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
        font-size="24" fill="#c9b896">Ein Login — alle Dienste der Universität.</text>

  <!-- Leistungsbilanz rechts -->
  <text x="1560" y="952" text-anchor="end" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
        font-size="26" font-weight="600" fill="#f2e8d2">32 Dienste · ein Login</text>
  <text x="1560" y="986" text-anchor="end" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
        font-size="18" fill="#a89a80">Neoplastizismus · nach Piet Mondrian</text>
</svg>
