    </g>
  </g>
  <g transform="translate(1304,841) scale(0.75294118)">
    <!-- Zeile 2, Spalte 5: Assistent (F13) -->
    <g>
      <rect width="340" height="210" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
      <rect width="340" height="6" rx="3" fill="#c026d3"/>
      <g transform="translate(122,58)" fill="none" stroke="#c026d3" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
        <rect x="10" y="10" width="76" height="76" rx="16"/>
      </g>
      <g transform="translate(122,58)" fill="#c026d3">
        <path d="M 48 28 l 4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4 z"/>
      </g>
      <text x="170" y="182" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
            font-size="28" font-weight="600" fill="#334155">Assistent</text>
    </g>
  </g>

  <!-- Fußzeile -->
  <text x="840" y="1026" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
        font-size="18" fill="#64748b">openEduSuite — 32 Dienste für Lehre, Studium und Forschung · Stand: November 2026</text>
</svg>
