      <g transform="translate(124,58)" fill="#0284c7">
        <path d="M 40 0 l 8 24 24 8 -24 8 -8 24 -8 -24 -24 -8 24 -8 z"/>
        <path d="M 76 44 l 5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5 z"/>
      </g>
      <text x="170" y="182" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
