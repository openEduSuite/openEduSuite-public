        <path d="M 54 0 v 22 h 22"/>
        <path d="M 26 40 h 34 M 26 56 h 34"/>
      </g>
      <text x="170" y="182" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
            font-size="28" font-weight="600" fill="#334155">Dokumente</text>
    </g>
  </g>
  <g transform="translate(416,841) scale(0.75294118)">
    <!-- Zeile 2, Spalte 2: Kalender -->
    <g>
      <rect width="340" height="210" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
      <rect width="340" height="6" rx="3" fill="#059669"/>
      <g transform="translate(124,58)" fill="none" stroke="#059669" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
        <rect x="0" y="10" width="88" height="72" rx="10"/>
        <path d="M 0 34 h 88"/>
        <path d="M 22 0 v 18 M 66 0 v 18"/>
        <circle cx="28" cy="58" r="4" fill="#059669" stroke="none"/>
        <circle cx="48" cy="58" r="4" fill="#059669" stroke="none"/>
      </g>
      <text x="170" y="182" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
            font-size="28" font-weight="600" fill="#334155">Kalender</text>
    </g>
  </g>
  <g transform="translate(712,841) scale(0.75294118)">
    <!-- Zeile 2, Spalte 3: Identität -->
    <g>
      <rect width="340" height="210" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
      <rect width="340" height="6" rx="3" fill="#475569"/>
      <g transform="translate(124,56)" fill="none" stroke="#475569" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
        <path d="M 44 4 l 36 14 v 28 q 0 34 -36 46 q -36 -12 -36 -46 v -28 z"/>
        <circle cx="44" cy="40" r="12"/>
        <path d="M 26 72 q 6 -14 18 -14 q 12 0 18 14"/>
