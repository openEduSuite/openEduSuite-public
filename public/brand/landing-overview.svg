      <rect width="340" height="6" rx="3" fill="#0d9488"/>
      <g transform="translate(122,58)" fill="none" stroke="#0d9488" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
        <path d="M 34 4 h 28"/>
        <path d="M 42 4 v 22 l -24 36 a 10 10 0 0 0 8 16 h 44 a 10 10 0 0 0 8 -16 l -24 -36 v -22"/>
        <path d="M 18 58 h 60"/>
      </g>
      <text x="170" y="182" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
