# ArgoCD App-of-Apps values for the openEduSuite public deployment variants.
#
# Every value here is a PLACEHOLDER — replace before deploying in your cluster
# (see argocd/README.md). All domains/secrets live in
# helmfile/environments/example.yaml and are honoured as-is by helmfile.
#
# Declaring an app here does NOT deploy it — set `enabled: false` to keep the
# Application around but skip it, or remove the entry entirely.

global:
  # Repo containing this chart AND the helmfile tree. Fork openEduSuite-public
  # and point ArgoCD at your fork.
  repoURL: https://github.com/openEduSuite/openEduSuite-public.git
  targetRevision: main
  # Helmfile environment rendered by every child Application
  # (maps to helmfile/environments/example.yaml).
  helmfileEnvironment: example
  # ArgoCD project the children join
  project: default
  # Where apps are installed
  namespace: openedusuite
  # ArgoCD namespace the child Application CRDs are created in
  argocdNamespace: argocd
  destinationServer: https://kubernetes.default.svc
  # Extra env vars passed to the helmfile CMP (helmfile plugin). Empty here:
  # all configuration is expressed in helmfile/environments/example.yaml.
  # Example:
  # helmfilePluginEnv:
  #   - name: MASTER_PASSWORD
  #     value: CHANGEME
  helmfilePluginEnv: []

# Child Applications. `release` = helmfile release name used to select
# that app out of the shared helmfile tree (helmfile/helmfile.yaml.gotmpl).
# Wave 1 = observability, wave 5 = all application services.
apps:
  # --- bigbluebutton ---
  - name: bigbluebutton
    enabled: true
    phase: 5
    release: bigbluebutton
    description: 'openEduSuite bigbluebutton service'

